<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hovjournal</title>
<style>
:root{--bg:#fff;--card:#ececec;--field:#fafafa;--line:#cfcfcf;--text:#1c1c1c;--muted:#666;--btn:#2d6cdf;--red:#c92a2a;--yellow:#b07a00;--green:#2b8a3e}
body.dark{--bg:#121212;--card:#2a2a2a;--field:#1c1c1c;--line:#444;--text:#f2f2f2;--muted:#aaa;--red:#ff6b6b;--yellow:#ffd43b;--green:#51cf66}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);max-width:900px;margin:auto;padding:15px}
h1{text-align:center;margin:10px 0 8px}
.logo{display:block;width:130px;height:130px;margin:0 auto 18px;border-radius:50%}
.section{background:var(--card);padding:15px;border-radius:12px;margin-bottom:15px}
h2{margin-top:0;font-size:20px}
.horse{border-top:1px solid var(--line);padding:10px 0}
.btn{background:var(--btn);color:#fff;border:none;padding:10px 14px;border-radius:8px;font-size:15px;cursor:pointer;margin:2px 4px 2px 0}
.btn.gray{background:#6b6b6b}.btn.danger{background:#c92a2a}
.red{color:var(--red)}.yellow{color:var(--yellow)}.green{color:var(--green)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
details{margin-top:8px}summary{cursor:pointer;padding:6px 0}
input,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text);font-size:16px}
label{font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.setting input{width:auto;margin:0}.setting input[type=number]{width:80px}
.muted{color:var(--muted);font-size:14px}
.rem{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 0}
.rem p{margin:4px 0}.rem:last-of-type{border-bottom:none}
.rbtns{white-space:nowrap}.rbtns .btn{padding:6px 10px;font-size:14px}
.linkbtn{background:none;border:none;color:var(--btn);text-decoration:underline;cursor:pointer;font-size:14px;padding:4px 0}
.hidden{display:none}
@media print{
 body,body.dark{--bg:#fff;--card:#fff;--text:#000;--line:#999;background:#fff;color:#000}
 .noprint,.btn{display:none!important}
 .section{background:#fff}
}
</style>
</head>

<p>Senaste backup: <span id="lastBackup">-</span></p>
</div>

<div class="section noprint">
<h2>⚙️ Inställningar</h2>
<div class="setting"><span>Standardintervall hovkontroll (veckor)</span><input type="number" min="1" id="setCheck"></div>
<div class="setting"><span>Standardintervall skoning (veckor)</span><input type="number" min="1" id="setShoe"></div>
<div class="setting"><span>Notiser</span><input type="checkbox" id="setNotif"></div>
<div class="setting"><span>Mörkt tema</span><input type="checkbox" id="setDark"></div>
<button class="btn danger" id="clearAll">Rensa all data</button>
</div>

<script>
const KEY='hovjournal_v1';
const DAY=86400000;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
const diffDays=s=>Math.round((parse(s)-today())/DAY);

function defaults(){
 const d={settings:{checkInt:6,shoeInt:8,notif:false,dark:false},horses:[],history:[],dismissed:[],lastBackup:null};
 d.horses.push({id:uid(),name:'Bella',checkInt:6,shoeInt:8,lastDate:'2026-10-15',lastType:'Skodd runtom',nextCheck:'2026-11-26',nextShoe:'2026-12-10'});
 d.history.push({id:uid(),date:'2026-10-15',horseId:d.horses[0].id,horse:'Bella',event:'Skodd runtom'});
 return d;
}
let data;
function load(){
 try{const r=localStorage.getItem(KEY);data=r?JSON.parse(r):defaults()}catch(e){data=defaults()}
 data.settings=Object.assign({checkInt:6,shoeInt:8,notif:false,dark:false},data.settings||{});
 data.horses=data.horses||[];data.history=data.history||[];data.dismissed=data.dismissed||[];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Kunde inte spara data i webbläsaren.')}}

function dueText(label,date){
 const n=diffDays(date);
 if(n<0)return{cls:'red',txt:`${label} försenad med ${-n} ${-n===1?'dag':'dagar'}`,n};
 if(n===0)return{cls:'red',txt:`${label} idag`,n};
 if(n<=7)return{cls:'yellow',txt:`${label} om ${n} ${n===1?'dag':'dagar'}`,n};
 return null;
}
function reminders(includeDismissed){
 const out=[];
 data.horses.forEach(h=>{
  [['Hovkontroll',h.nextCheck],['Skoning/verkning',h.nextShoe]].forEach(([l,d])=>{
   if(!d)return;
   const key=h.id+'|'+l+'|'+d;
   if(!includeDismissed&&data.dismissed.includes(key))return;
   const r=dueText(l,d);if(r)out.push({...r,horse:h.name,label:l,date:d,key});
  });
 });
 return out.sort((a,b)=>a.n-b.n);
}
function horseStatus(h){
 const ds=[h.nextCheck,h.nextShoe].filter(Boolean).map(diffDays);
 if(!ds.length)return['yellow','Ingen planering'];
 const m=Math.min(...ds);
 if(m<0)return['red','Försenad'];
 if(m<=7)return['yellow','Snart dags'];
 return['green','OK'];
}
function renderReminders(){
 const r=reminders();
 const hidden=reminders(true).length-r.length;
 let html=r.length?r.map(x=>`<div class="rem"><p class="${x.cls}">${esc(x.horse)} - ${esc(x.txt)}</p><span class="rbtns noprint"><button class="btn" data-rcal="${esc(x.key)}">📅 Kalender</button><button class="btn gray" data-rdel="${esc(x.key)}">✕ Ta bort</button></span></div>`).join(''):'<p class="green">Inga aktuella påminnelser.</p>';
 if(hidden>0)html+=`<button class="linkbtn noprint" id="rShow">Visa borttagna påminnelser (${hidden})</button>`;
 document.getElementById('reminders').innerHTML=html;
}
function renderHorses(){
 const el=document.getElementById('horses');
 if(!data.horses.length){el.innerHTML='<p class="muted">Inga hästar tillagda än.</p>';return}
 el.innerHTML=data.horses.map(h=>{
  const [c,t]=horseStatus(h);
  return `<details open><summary><strong>${esc(h.name)}</strong></summary><div class="horse">
  <p>Senast: ${h.lastDate?esc(h.lastDate):'-'}</p>
  <p>Typ: ${h.lastType?esc(h.lastType):'-'}</p>
  <p>Hovkontroll: ${h.nextCheck?esc(h.nextCheck):'-'}</p>
  <p>Nästa skoning: ${h.nextShoe?esc(h.nextShoe):'-'}</p>
  <p class="${c}">Status: ${t}</p>
  <button class="btn" data-reg="${h.id}">+ Ny registrering</button>
  <button class="btn gray" data-del="${h.id}">Ta bort häst</button>
  </div></details>`}).join('');
}
function renderHistory(){
 const rows=[...data.history].sort((a,b)=>b.date.localeCompare(a.date));
 document.getElementById('history').innerHTML=rows.length?
 `<table><tr><th>Datum</th><th>Häst</th><th>Händelse</th><th class="noprint"></th></tr>`+
 rows.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.horse)}</td><td>${esc(r.event)}</td><td class="noprint"><button class="btn gray" data-hdel="${r.id}">✕</button></td></tr>`).join('')+`</table>`:
 '<p class="muted">Ingen historik ännu.</p>';
}
function renderSettings(){
 const s=data.settings;
 setCheck.value=s.checkInt;setShoe.value=s.shoeInt;setNotif.checked=!!s.notif;setDark.checked=!!s.dark;
 document.body.classList.toggle('dark',!!s.dark);
 lastBackup.textContent=data.lastBackup?new Date(data.lastBackup).toLocaleString('sv-SE'):'-';
}
function render(){renderReminders();renderHorses();renderHistory();renderSettings()}

// Lägg till häst
addHorse.addEventListener('submit',e=>{
 e.preventDefault();
 const name=newName.value.trim();if(!name)return;
 data.horses.push({id:uid(),name,checkInt:data.settings.checkInt,shoeInt:data.settings.shoeInt,lastDate:'',lastType:'',nextCheck:'',nextShoe:''});
 newName.value='';save();render();
});
// Klick i hästlistan
horses.addEventListener('click',e=>{
 const reg=e.target.dataset.reg,del=e.target.dataset.del;
 if(reg){
  const h=data.horses.find(x=>x.id===reg);if(!h)return;
  regBox.dataset.id=reg;regHorseName.textContent=h.name;
  regDate.value=iso(today());regType.selectedIndex=0;
  regCheckInt.value=h.checkInt||data.settings.checkInt;regShoeInt.value=h.shoeInt||data.settings.shoeInt;
  regBox.classList.remove('hidden');regBox.scrollIntoView({behavior:'smooth'});
 }
 if(del){
  const h=data.horses.find(x=>x.id===del);
  if(h&&confirm(`Ta bort ${h.name}? Historiken för hästen behålls.`)){data.horses=data.horses.filter(x=>x.id!==del);save();render()}
 }
});
regCancel.addEventListener('click',()=>regBox.classList.add('hidden'));
regForm.addEventListener('submit',e=>{
 e.preventDefault();
 const h=data.horses.find(x=>x.id===regBox.dataset.id);if(!h)return;
 const date=regDate.value,type=regType.value;
 const ci=Math.max(1,parseInt(regCheckInt.value)||data.settings.checkInt);
 const si=Math.max(1,parseInt(regShoeInt.value)||data.settings.shoeInt);
 h.checkInt=ci;h.shoeInt=si;
 h.nextCheck=iso(addDays(parse(date),ci*7));
 if(type!=='Hovkontroll'){h.lastDate=date;h.lastType=type;h.nextShoe=iso(addDays(parse(date),si*7))}
 else if(!h.lastDate||date>=h.lastDate){h.lastDate=date;h.lastType=type}
 data.history.push({id:uid(),date,horseId:h.id,horse:h.name,event:type==='Hovkontroll'?'Hovkontroll utförd':type});
 save();regBox.classList.add('hidden');render();notify();
});
document.getElementById('history').addEventListener('click',e=>{
 const id=e.target.dataset.hdel;
 if(id&&confirm('Ta bort raden från historiken?')){data.history=data.history.filter(x=>x.id!==id);save();renderHistory()}
});

// Påminnelser: ta bort / kalender
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function addToCalendar(x){
 let d=parse(x.date);if(d<today())d=today();
 const ymd=dt=>dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate());
 const n=new Date();
 const stamp=n.getUTCFullYear()+pad(n.getUTCMonth()+1)+pad(n.getUTCDate())+'T'+pad(n.getUTCHours())+pad(n.getUTCMinutes())+pad(n.getUTCSeconds())+'Z';
 const title=`${x.horse} - ${x.label}`;
 const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hovjournal//SV','CALSCALE:GREGORIAN','METHOD:PUBLISH',
  'BEGIN:VEVENT','UID:'+uid()+'@hovjournal','DTSTAMP:'+stamp,
  'DTSTART;VALUE=DATE:'+ymd(d),'DTEND;VALUE=DATE:'+ymd(addDays(d,1)),
  'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc('Påminnelse från Hovjournal'+(x.date!==iso(d)?' (ursprungligt datum '+x.date+')':'')),
  'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:-PT15H','END:VALARM',
  'END:VEVENT','END:VCALENDAR'].join('\r\n')+'\r\n';
 download('hovkalender_'+x.horse.replace(/[^\wåäöÅÄÖ-]+/g,'_')+'_'+ymd(d)+'.ics',ics,'text/calendar;charset=utf-8');
}
document.getElementById('reminders').addEventListener('click',e=>{
 const del=e.target.dataset.rdel,cal=e.target.dataset.rcal;
 if(del){data.dismissed.push(del);save();renderReminders()}
 if(cal){const x=reminders().find(r=>r.key===cal);if(x)addToCalendar(x)}
 if(e.target.id==='rShow'){
  if(confirm('Visa alla borttagna påminnelser igen?')){data.dismissed=[];save();renderReminders()}
 }
});

// Export
function download(name,content,type){
 const b=new Blob([content],{type});const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
const sorted=()=>[...data.history].sort((a,b)=>b.date.localeCompare(a.date));
expCsv.onclick=()=>{
 const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const csv='﻿'+['Datum;Häst;Händelse',...sorted().map(r=>[r.date,q(r.horse),q(r.event)].join(';'))].join('\r\n');
 download('hovjournal_historik.csv',csv,'text/csv;charset=utf-8');
};
expJson.onclick=()=>download('hovjournal_historik.json',JSON.stringify(sorted(),null,2),'application/json');
expPdf.onclick=()=>window.print();

// Backup
bkCreate.onclick=()=>{
 data.lastBackup=new Date().toISOString();save();renderSettings();
 download(`hovjournal_backup_${iso(today())}.json`,JSON.stringify(data,null,2),'application/json');
};
bkRestore.onclick=()=>bkFile.click();
bkFile.onchange=()=>{
 const f=bkFile.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{
  try{
   const d=JSON.parse(r.result);
   if(!Array.isArray(d.horses)||!Array.isArray(d.history))throw 0;
   if(!confirm('Återställa backupen? Nuvarande data ersätts.'))return;
   data=d;load2();data.dismissed=data.dismissed||[];save();render();
  }catch(e){alert('Filen är inte en giltig backup.')}
 };
 r.readAsText(f);bkFile.value='';
};
function load2(){data.settings=Object.assign({checkInt:6,shoeInt:8,notif:false,dark:false},data.settings||{})}

// Inställningar
setCheck.onchange=()=>{data.settings.checkInt=Math.max(1,parseInt(setCheck.value)||6);save();render()};
setShoe.onchange=()=>{data.settings.shoeInt=Math.max(1,parseInt(setShoe.value)||8);save();render()};
setDark.onchange=()=>{data.settings.dark=setDark.checked;save();renderSettings()};
setNotif.onchange=async()=>{
 if(setNotif.checked){
  if(!('Notification' in window)){alert('Din webbläsare stöder inte notiser.');setNotif.checked=false;return}
  const p=await Notification.requestPermission();
  if(p!=='granted'){alert('Notiser är blockerade i webbläsaren.');setNotif.checked=false;return}
  data.settings.notif=true;notify();
 }else data.settings.notif=false;
 save();
};
clearAll.onclick=()=>{
 if(confirm('Rensa ALL data? Detta går inte att ångra.')&&confirm('Är du helt säker?')){
  data={settings:data.settings,horses:[],history:[],dismissed:[],lastBackup:null};save();render();
 }
};
function notify(){
 if(!data.settings.notif||!('Notification' in window)||Notification.permission!=='granted')return;
 const r=reminders();if(!r.length)return;
 try{new Notification('Hovjournal',{body:r.map(x=>`${x.horse} - ${x.txt}`).join('\n')})}catch(e){}
}

load();save();render();notify();
</script>
</body>
</html>
